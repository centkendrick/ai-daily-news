name: Daily AI News Agent

on:
  schedule:
    # GitHub 使用的是 UTC 时间。北京时间 20:00 = UTC 12:00
    - cron: '0 12 * * *'
  workflow_dispatch: # 允许你在网页上手动点按钮测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          # 从 GitHub Secrets 中安全读取密钥
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
        run: python auto_news_agent.py
